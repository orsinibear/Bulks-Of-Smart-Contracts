[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.default.ffi]
enabled = false

[profile.default.metadata]
bytecode_hash = "ipfs"

[profile.default.model_checker]
contracts = {}
divModNoSlacks = true
engine = "all"
extCalls = "trusted"
invariants = ["contract", "reentrancy"]
print_info = true
show_proved = true
show_unsupported = true
show_unproved = true
solvers = ["z3"]
targets = ["assert", "underflow", "overflow"]
timeout = 0

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 256 }

